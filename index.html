<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"
        integrity="sha512-ZG31AN9z/CQD1YDDAK4RUAvogwbJHv6bHrumrnMLzdCrVu4HeAqrUX7Jsal/cbUwXGfaMUNmQU04tQ8XXl5Znw=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/js/all.min.js" integrity="sha512-b+nQTCdtTBIRIbraqNEwsjB6UvL3UEMkXnhzd8awtCYh0Kcsjl9uEgwVFVbhoj3uu1DO1ZMacNvLoyJJiNfcvg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="vm.js"></script>
    <title>Document</title>
</head>

<body>
    <div class="top">
        <div class="controls">
            <button class="control" id="run">
                <span class="icon">
                    <i class="fas fa-play"></i>
                </span>
                <span class="label">Run</span>
                <span class="hotkey">F5</span>
            </button>
            <button class="control" id="pause">
                <span class="icon">
                    <i class="fas fa-pause"></i>
                </span>
                <span class="label">Pause</span>
                <span class="hotkey">F5</span>
            </button>
            <button class="control" id="step">
                <span class="icon">
                    <i class="fas fa-forward-step"></i>
                </span>
                <span class="label">Step</span>
                <span class="hotkey">F6</span>
            </button>
            <button class="control" id="reset">
                <span class="icon">
                    <i class="fa-solid fa-arrow-rotate-left"></i>
                </span>
                <span class="label">Reset</span>
                <span class="hotkey">F7</span>
            </button>
            <button class="control" id="run-bp">
                <span class="icon">
                    <i class="fa-solid fa-bug"></i>
                </span>
                <span class="label">Debug</span>
                <span class="hotkey">F8</span>
            </button>
            <div class="vs"></div>
            <div class="vs"></div>
            <button class="control" id="docs">
                <span class="icon">
                    <i class="fa-solid fa-book"></i>
                </span>
                <span class="label">Docs</span>
                <span class="hotkey">F1</span>
            </button>
            <button class="control" id="save">
                <span class="icon">
                    <i class="fa-solid fa-save"></i>
                </span>
                <span class="label">Save Program</span>
            </button>
            <button class="control" id="save-ram">
                <span class="icon">
                    <i class="fa-solid fa-memory"></i>
                </span>
                <span class="label">Save From RAM</span>
            </button>
            <button class="control" id="load-ram">
                <span class="icon">
                    <i class="fa-solid fa-memory"></i>
                </span>
                <span class="label">Load To RAM</span>
            </button>
        </div>
        <div class="vs"></div>
        <div class="registers">
            <button class="register">
                <span class="register-name">ACC</span>
                <span id="REG-ACC-HOLDER" class="register-value">0</span>
            </button>
            <button class="register">
                <span class="register-name">BAK</span>
                <span id="REG-BAK-HOLDER" class="register-value">0</span>
            </button>
            <button class="register">
                <span class="register-name">GPR</span>
                <span id="REG-GPR-HOLDER" class="register-value">0</span>
            </button>
            <button class="register">
                <span class="register-name">DSP</span>
                <span id="REG-DSP-HOLDER" class="register-value">0</span>
            </button>
            <button class="register">
                <span class="register-name">STC</span>
                <span id="REG-STC-HOLDER" class="register-value">0</span>
            </button>
            <button class="register">
                <span class="register-name">PRC</span>
                <span id="REG-PRC-HOLDER" class="register-value">0</span>
            </button>
        </div>
    </div>

    <!-- Actual Content -->
    <div class="content">
        <div id="editor"></div>
        <div class="memories">
            <div id="display-container">
                <div class="title">
                    Display
                </div>
                <div id="display">
    
                </div>
            </div>
            <div id="stack">
                <div class="title">
                    Stack Memory
                </div>
            </div>
        </div>
    </div>

    <!-- Popups -->
    <div class="modal active" id="modal-notif">
        <div class="modal-content">
            <article id="modal-content-docs" class="modal-content-content">
                Loading...
            </article>
            <button class="control" id="close-modal" style="position: absolute; top: -16px; right: 0; height: 30px; border: 0;">
                <span class="icon" style="font-size: 14px">
                    <i class="fa-solid fa-close"></i>
                </span>
                <span class="hotkey">esc</span>
            </button>
        </div>
    </div>
</body>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap');

    html,
    body {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        max-width: 100vw;
        max-height: 100vh;
        margin: 0;
        padding: 0;
    }

    pre {
        margin-left: 2rem;
        padding: 0.75rem;
        min-width: 75%;
        max-width: 85%;
        border: 1px solid #ccc;
        background-color: #fdfded;
        overflow-x: auto;
        filter: drop-shadow(0 0 5px #00000022);
        border-radius: 8px;
        font-size: small;
    }
    
    pre code, code {
        background-color: #fdfded;
        font-family: 'Roboto Mono', 'Courier New', Courier, monospace;
    }

    .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.75);
        justify-content: center;
        align-items: center;
        z-index: 1000;

        justify-content: center;
        align-items: center;
        display: none;
    }

    .modal.active {
        display: flex;
    }

    .modal .modal-content {
        width: 66%;
        height: 75%;
        background-color: #ededed;
        padding: 0.25rem;
        padding-top: 0;
        margin: 0;
        position: relative;
        border-radius: 10px;
    }

    .modal-content-content {
        margin: 1rem;
        padding-top: 0;
        margin-right: 0rem;
        padding-right: 1rem;
        overflow-y: scroll;

        font-family: 'Noto Sans', sans-serif;

        text-align: center;
    }

    .modal-content-content h3 {

        margin-top: 0;
        padding-top: 0;
    }

        background-color: #f0f0f0;
        border-left: 4px solid #ccc;
        padding-left: 1rem;
        color: #666;
        font-style: italic;
        text-shadow: #66666622 1px 1px 0;
    }

    .content {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 93%;
    }

    .content #editor {
        width: calc(100% - 270px);
        height: 100%;
    }

    #display-container {
        min-height: 300px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    #display {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    #display .row {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
    }

        background-color: black;
        width: 1px;
        height: 1px;

        padding: 0;

        display: flex;
        flex-direction: column;
        width: 260px;
        min-width: 260px;

        justify-content: center;
        align-items: center;
        font-family: 'Courier New', Courier, monospace;
    }

    .memories div .title {
        width: 100%;
        text-align: center;
        font-weight: bolder;
    }

    .memories #stack {
        width: 100%;

        overflow: hidden;
        overflow-y: auto;
        border-bottom: 1px solid black;

        padding-right: 0.25rem;

        background-color: rgba(241, 100, 100, 0.556);
    }

    #row {
        display: flex;
        flex-direction: row;

    }

    #row #address {
        font-weight: bold;
        width: 25%;
    }

    #row #value {
        border-left: 1px solid black;
        padding-left: 0.25rem;
        width: 75%;
    }

    .top {
        display: flex;
        flex-direction: row;
        justify-content: space-between;

        padding-right: 1rem;
        padding-left: 1rem;
        margin-top: 0.25rem;
        margin-bottom: 0.25rem;

    .registers .register .register-value {

        height: 100%;
        justify-content: center;
        align-items: center;
        text-align: center;
        vertical-align: center;
        font-family: 'Courier New', Courier, monospace;
        font-weight: bolder;
        font-size: 16px;
    }

    .controls {
        display: flex;
        flex-direction: row;
        justify-content: space-evenly;
        align-items: center;
        gap: 0.33rem;
    }

    .control {
        display: flex;
        flex-direction: column;
        justify-content: center;

        min-width: 50px;

    }

    .control .label {

        font-weight: bold;

    }

    .control .icon {
        margin-right: 0;

    }

    .control .hotkey {
        position: absolute;
        top: 1px;

        font-size: 9px; /* Make it smaller */

    .control:hover {
        background: #978585;
    }

        background: #000000;

    .vs {

    }

    .myGlyphMarginClass {
        background: red;
    }
    .myContentClass {
        /* Make sure to use transparent colors for the selection to work */
        background: rgba(173, 216, 230, 0.5);
    }

</style>
<script defer>
    let MONACO_IS_READY = false;
    let EDITOR = null;
    let MONACO = null;

    document.getElementById("close-modal").onclick = async () => {
        const modal = document.getElementById("modal-notif");
        console.log(modal);
        modal.classList.toggle("active");
    };
    console.log(document.getElementById("run-bp"));

    function prepareAfterMonaco() {
        const btn_run = document.getElementById("run");
        const btn_pause = document.getElementById("pause");
        const btn_step = document.getElementById("step");
        const btn_reset = document.getElementById("reset");
        const btn_runbp = document.getElementById("run-bp");
        const btn_docs = document.getElementById("docs");
        const btn_save = document.getElementById("save");
        const btn_saveram = document.getElementById("save-ram");
        const btn_loadram = document.getElementById("load-ram");
    
        btn_run.onclick = async () => {
            setTimeout(async () => {
                // get source from editor
                console.log("Running");
                const source = EDITOR.getValue();
                const machineCode = assembleSource(source);
                VM_start(machineCode);
            }, 100)
        };
        btn_pause.onclick = () => {
            if(STATE === "RUNNING") VM_stop();
            else VM_continue();
        };
        btn_step.onclick = () => {
    
        };
        btn_reset.onclick = () => {
            VM_reset();
            VM_reset();
        };
        btn_runbp.onclick = () => {
    
        };
        btn_docs.onclick = async () => {
            const modal = document.getElementById("modal-notif");
            console.log(modal);
            modal.classList.toggle("active");
        };
        btn_save.onclick = () => {
    
        };
        btn_saveram.onclick = () => {
    
        };
        btn_loadram.onclick = () => {
    
        };

        let decorations = EDITOR.createDecorationsCollection([]);
        async function highlightLine() {
            const line = REGISTERS.PRC.value;
            decorations.clear()
            decorations = EDITOR.createDecorationsCollection([
                {
                    range: new monaco.Range(line+1, 1, line+1, 1),
                    options: {
                        isWholeLine: true,
                        className: "myContentClass",
                        glyphMarginClassName: "myGlyphMarginClass",
                    },
                },
            ]);
        }

        function updateStack() {
            const allCells = STACK.all();

            let str = `
            <div id="stack">
                <div class="title">
                    Stack Memory
                </div>
            `;
            let i=0;
            for(const cell of allCells) {
                let number = cell;
                let hex = number.toString(16).padStart(4, '0');
                let dec = number.toString().padStart(6, '0');
                str += `<div id="row">
                    <div id="address">${i}</div>
                    <div id="value">&emsp13;${hex}&emsp13;&emsp13;|&emsp13;&emsp13;${dec}</div>
                </div>`
            }
            str += `</div>`;

            document.getElementById("stack").innerHTML = str;
        }

        REGISTERS.ACC.addHandler(async () => { 
            document.getElementById("REG-ACC-HOLDER").innerText = REGISTERS.ACC.value;
        });
        REGISTERS.BAK.addHandler(async () => {
            document.getElementById("REG-BAK-HOLDER").innerText = REGISTERS.BAK.value;
        });
        REGISTERS.GPR.addHandler(async () => {
            document.getElementById("REG-GPR-HOLDER").innerText = REGISTERS.GPR.value;
            highlightLine();
        });
        REGISTERS.DSP.addHandler(async () => {
            document.getElementById("REG-DSP-HOLDER").innerText = REGISTERS.DSP.value;
        });
        REGISTERS.DSP.displayHandler = async (e) => {
            const {coordinate, r, g, b} = e;
            const cell = document.getElementById(`disp-pixel-${coordinate}`);
            if(cell) cell.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
        }
        REGISTERS.STC.addHandler(async () => {
        });
        REGISTERS.PRC.addHandler(async () => {
            document.getElementById("REG-PRC-HOLDER").innerText = REGISTERS.PRC.value;
        });
        
        AFTER_EXEC_EVENT_HANDLER = async () => {
            document.getElementById("REG-STC-HOLDER").innerText = STACK.length;
            highlightLine();
            updateStack();
        }

        /* PREPARE DISPLAY */ (() => {
            const container = document.getElementById('display');
            let row = "";
    
            for(let i=0; i<256; i++) {
                let cells = "<div class='row'>";
                for(let j=0; j<256; j++) {
                    const coord = i * 256 + j;
                    cells += `<div class='cell' id='disp-pixel-${coord}'></div>`;
                }
                cells += "</div>";
    
                row += cells;
            }
    
            container.innerHTML = row;
        })();

        
        fetch("https://raw.githubusercontent.com/wowotek/isvm/refs/heads/production/README.md")
            .then(response => response.text())
            .then(data => {
                const modalContent = document.getElementById("modal-content-docs");
                modalContent.innerHTML = marked.parse(data);
            });

    }

    require.config({ paths: { 'vs': 'https://unpkg.com/monaco-editor@latest/min/vs' } });
    window.MonacoEnvironment = { getWorkerUrl: () => proxy };
    let proxy = URL.createObjectURL(new Blob(
        [`
            self.MonacoEnvironment = {
                baseUrl: 'https://unpkg.com/monaco-editor@latest/min/'
            };
            importScripts('https://unpkg.com/monaco-editor@latest/min/vs/base/worker/workerMain.js');
        `],
        { type: 'text/javascript' }
    ));

    require(["vs/editor/editor.main"], function () {
        monaco.languages.register({ id: 'tislang' });

        // Register a tokens provider for the language
        monaco.languages.setMonarchTokensProvider('tislang', {
            symbols: /[=<>!~?:&|+\-*\/^%]+/,

            tokenizer: {
                root: [
                    // Labels (must end with a colon, with optional leading spaces)
                    [/^\s*([A-Za-z_][\w]*)(:)/, ['type.identifier', 'delimiter']],

                    // Keywords (instructions)
                    [/\b(?:NOP|MOV|PUSH|POP|SWP|SAV|ADD|SUB|NEG|NOT|AND|OR|XOR|NAND|NOR|XNOR|SHR|SHL|JMP|JEZ|JNZ|JGZ|JLZ|JRO|HALT|nop|mov|push|pop|swp|sav|add|sub|neg|not|and|or|xor|nand|nor|xnor|shr|shl|jmp|jez|jnz|jgz|jlz|jro|halt)\b/, 'keyword'],

                    // Label references (after JMP, JEZ, JGZ, etc.)
                    [/\b(?:JMP|JEZ|JNZ|JGZ|JLZ|JRO|jmp|jez|jnz|jgz|jlz|jro)\s+([A-Za-z_][\w]*)\b/, ['keyword', 'type.identifier']],

                    // Registers (Only ACC, BAK is not accessible directly)
                    [/\b(ACC|GPR|DSP|STC)\b/, 'variable'],
                    [/\b(BAK)\b/, 'invalid'],

                    // Memory addresses ($ followed by digits or hex values)
                    [/\$0x[0-9a-fA-F]+\b/, 'storage.hex'], // Hex memory address ($0xABCD)
                    [/\$\d+\b/, 'storage.number'],         // Decimal memory address ($1234)

                    // Literals (numeric constants)
                    [/\b\d+\b/, 'number'],                 // 1234 (Decimal)
                    [/0x[0-9a-fA-F]+\b/, 'number.hex'],    // 0xABCD (Hex)

                    // Comments
                    [/#.*/, 'comment'],

                    // Whitespace
                    [/[ \t\r\n]+/, 'white'],
                ]
            }
        });

        monaco.editor.defineTheme("tis-theme", {
            base: "vs-dark",
            inherit: true,
            rules: [
                { token: "keyword", foreground: "ffff00", background: "ff0000", fontStyle: "bold" },
                { token: "variable", foreground: "A0F0FF" },
                { token: "storage.number", foreground: "FFAA00"},
                { token: "storage.hex", foreground: "FFAA00"},
                { token: "number", foreground: "FF8A00"},
                { token: "number.hex", foreground: "FF8A00"},
                { token: "comment", foreground: "20a872"},
                { token: "type.identifier", foreground: "FF00FF"},
                { token: "invalid", foreground: "FF0000", fontStyle: "italic underline" },
            ],
            colors: {
                "editor.foreground": "#A250A2",
            },
        });

        // Register a completion item provider for the new language
        monaco.languages.registerCompletionItemProvider("tislang", {
            provideCompletionItems: (model, position) => {
                var word = model.getWordUntilPosition(position);
                var range = {
                    startLineNumber: position.lineNumber,
                    endLineNumber: position.lineNumber,
                    startColumn: word.startColumn,
                    endColumn: word.endColumn,
                };
                var suggestions = [
                    {
                        label: "MOV",
                        kind: monaco.languages.CompletionItemKind.Keyword,
                        insertText: "MOV ${1:source} ${2:destination}",
                        insertTextRules:
                            monaco.languages.CompletionItemInsertTextRule
                                .InsertAsSnippet,
                        range: range,
                    },
                    {
                        label: 'NOP',
                        kind: monaco.languages.CompletionItemKind.Keyword,
                        insertText: "NOP",
                        range: range
                    },
                    {
                        label: 'SWP',
                        kind: monaco.languages.CompletionItemKind.Keyword,
                        insertText: "SWP",
                        range: range
                    },
                    {
                        label: 'SAV',
                        kind: monaco.languages.CompletionItemKind.Keyword,
                        insertText: "SAV",
                        range: range
                    },
                    {
                        label: 'ADD',
                        kind: monaco.languages.CompletionItemKind.Keyword,
                        insertText: "ADD ${1:source}",
                        insertTextRules:
                            monaco.languages.CompletionItemInsertTextRule
                                .InsertAsSnippet,
                        range: range
                    },
                    {
                        label: 'SUB',
                        kind: monaco.languages.CompletionItemKind.Keyword,
                        insertText: "SUB ${1:source}",
                        insertTextRules:
                            monaco.languages.CompletionItemInsertTextRule
                                .InsertAsSnippet,
                        range: range
                    },
                    {
                        label: 'NEG',
                        kind: monaco.languages.CompletionItemKind.Keyword,
                        insertText: "NEG ${1:source}",
                        insertTextRules:
                            monaco.languages.CompletionItemInsertTextRule
                                .InsertAsSnippet,
                        range: range
                    },
                    {
                        label: 'JMP',
                        kind: monaco.languages.CompletionItemKind.Keyword,
                        insertText: "JMP ${1:label}",
                        insertTextRules:
                            monaco.languages.CompletionItemInsertTextRule
                                .InsertAsSnippet,
                        range: range
                    },
                    {
                        label: 'JEZ',
                        kind: monaco.languages.CompletionItemKind.Keyword,
                        insertText: "JEZ ${1:label}",
                        insertTextRules:
                            monaco.languages.CompletionItemInsertTextRule
                                .InsertAsSnippet,
                        range: range
                    },
                    {
                        label: 'JNZ',
                        kind: monaco.languages.CompletionItemKind.Keyword,
                        insertText: "JNZ ${1:label}",
                        insertTextRules:
                            monaco.languages.CompletionItemInsertTextRule
                                .InsertAsSnippet,
                        range: range
                    },
                    {
                        label: 'JGZ',
                        kind: monaco.languages.CompletionItemKind.Keyword,
                        insertText: "JGZ ${1:label}",
                        insertTextRules:
                            monaco.languages.CompletionItemInsertTextRule
                                .InsertAsSnippet,
                        range: range
                    },
                    {
                        label: 'JLZ',
                        kind: monaco.languages.CompletionItemKind.Keyword,
                        insertText: "JLZ ${1:label}",
                        insertTextRules:
                            monaco.languages.CompletionItemInsertTextRule
                                .InsertAsSnippet,
                        range: range
                    },
                    {
                        label: 'JRO',
                        kind: monaco.languages.CompletionItemKind.Keyword,
                        insertText: "JRO ${1:offset}",
                        insertTextRules:
                            monaco.languages.CompletionItemInsertTextRule
                                .InsertAsSnippet,
                        range: range
                    },
                    {
                        label: 'HALT',
                        kind: monaco.languages.CompletionItemKind.Keyword,
                        insertText: "JRO",
                        insertTextRules:
                            monaco.languages.CompletionItemInsertTextRule
                                .InsertAsSnippet,
                        range: range
                    },
                ];
                return { suggestions: suggestions };
            },
        });

        // get source from "./prog_multiplication.asm file"
        fetch("https://raw.githubusercontent.com/wowotek/isvm/refs/heads/production/prog_math.asm")
            .then(response => response.text())
            .then(data => {
                let editor = monaco.editor.create(document.getElementById('editor'), {
                    value: data,
                    language: 'tislang',
                    theme: 'tis-theme',
                    automaticLayout: true,
                    lineNumbers: (originalNumber) => originalNumber - 1
                });
        
                EDITOR = editor;
                MONACO = monaco;
                MONACO_IS_READY = true;
        
                prepareAfterMonaco();
            });
    });
</script>
