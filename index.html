<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/editor/editor.main.js" integrity="sha512-Rvm80pldXwjZQPHcW9Dx3U8pygTafC25yXwrxrPC6ZuNVgBsR2BN2pFAU2ImvYYeFcUaKo7bRcf7KxHD+LMp6w==" crossorigin="anonymous" referrerpolicy="no-referrer"></script> -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"
        integrity="sha512-ZG31AN9z/CQD1YDDAK4RUAvogwbJHv6bHrumrnMLzdCrVu4HeAqrUX7Jsal/cbUwXGfaMUNmQU04tQ8XXl5Znw=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/js/all.min.js" integrity="sha512-b+nQTCdtTBIRIbraqNEwsjB6UvL3UEMkXnhzd8awtCYh0Kcsjl9uEgwVFVbhoj3uu1DO1ZMacNvLoyJJiNfcvg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <title>Document</title>
</head>

<body>
    <div class="top">
        <div class="controls">
            <button class="control" id="run">
                <span class="icon">
                    <i class="fas fa-play"></i>
                </span>
                <span class="label">Run</span>
                <span class="hotkey">F5</span>
            </button>
            <button class="control" id="pause">
                <span class="icon">
                    <i class="fas fa-pause"></i>
                </span>
                <span class="label">Pause</span>
                <span class="hotkey">F5</span>
            </button>
            <button class="control" id="step">
                <span class="icon">
                    <i class="fas fa-forward-step"></i>
                </span>
                <span class="label">Step</span>
                <span class="hotkey">F6</span>
            </button>
            <button class="control" id="reset">
                <span class="icon">
                    <i class="fa-solid fa-arrow-rotate-left"></i>
                </span>
                <span class="label">Reset</span>
                <span class="hotkey">F7</span>
            </button>
            <button class="control" id="run-bp">
                <span class="icon">
                    <i class="fa-solid fa-bug"></i>
                </span>
                <span class="label">Debug</span>
                <span class="hotkey">F8</span>
            </button>
            <div class="vs"></div>
            <div class="vs"></div>
            <button class="control" id="docs">
                <span class="icon">
                    <i class="fa-solid fa-book"></i>
                </span>
                <span class="label">Docs</span>
                <span class="hotkey">F1</span>
            </button>
            <button class="control" id="save">
                <span class="icon">
                    <i class="fa-solid fa-save"></i>
                </span>
                <span class="label">Save Program</span>
            </button>
            <button class="control" id="docs">
                <span class="icon">
                    <i class="fa-solid fa-memory"></i>
                </span>
                <span class="label">Save From RAM</span>
            </button>
            <button class="control" id="docs">
                <span class="icon">
                    <i class="fa-solid fa-memory"></i>
                </span>
                <span class="label">Load To RAM</span>
            </button>
        </div>
        <div class="vs"></div>
        <div class="registers">
            <button class="register">
                <span class="register-name">ACC</span>
                <span class="register-value">12418297</span>
            </button>
            <button class="register">
                <span class="register-name">BAK</span>
                <span class="register-value">0</span>
            </button>
            <button class="register">
                <span class="register-name">GPR</span>
                <span class="register-value">0</span>
            </button>
            <button class="register">
                <span class="register-name">STC</span>
                <span class="register-value">0</span>
            </button>
            <button class="register">
                <span class="register-name">PRC</span>
                <span class="register-value">0</span>
            </button>
        </div>
    </div>
    <div class="content">
        <div id="editor"></div>
        <div class="memories">
            <div id="display-container">
                <div class="title">
                    Display
                </div>
                <div id="display">
    
                </div>
            </div>
            <div id="stack">
                <div class="title">
                    Stack Memory
                </div>
                <div id="row">
                    <div id="address">0</div>
                    <div id="value">0x0000000000000000</div>
                </div>
                <div id="row">
                    <div id="address">1</div>
                    <div id="value">0x0000000000000000</div>
                </div>
                <div id="row">
                    <div id="address">16</div>
                    <div id="value">0x0000000000000000</div>
                </div>
                <div id="row">
                    <div id="address">128</div>
                    <div id="value">0x0000000000000000</div>
                </div>
                <div id="row">
                    <div id="address">1024</div>
                    <div id="value">0x0000000000000000</div>
                </div>
            </div>
        </div>
    </div>
</body>

<style>
    html,
    body {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        max-width: 100vw;
        max-height: 100vh;
        margin: 0;
        padding: 0;
    }

    .content {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 93%;
    }

    .content #editor {
        width: calc(100% - 270px);
        height: 100%;
    }

    #display-container {
        min-height: 300px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    #display {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    #display .row {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
    }

    #display .row .cell {
        background-color: black;
        width: 1px;
        height: 1px;
        margin: 0;
        padding: 0;
    }

    .memories {
        display: flex;
        flex-direction: column;
        width: 260px;
        min-width: 260px;
        max-width: 260px;
        height: 100%;
        gap: 0.33rem;
        justify-content: center;
        align-items: center;
        font-family: 'Courier New', Courier, monospace;
    }

    .memories div .title {
        width: 100%;
        text-align: center;
        font-weight: bolder;
    }

    .memories #stack {
        width: 100%;
        height: 100%;
        overflow: hidden;
        overflow-y: auto;
        border-bottom: 1px solid black;

        padding-left: 0.25rem;
        padding-right: 0.25rem;
    }
    #stack #row:first-child {
        background-color: rgba(241, 100, 100, 0.556);
    }

    #row {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid black;
        background-color: white;
        padding-left: 0.25rem;
        padding-right: 0.25rem;
        font-size: 12px;
    }

    #row #address {
        font-weight: bold;
    }

    #row #value {
        border-left: 1px solid black;
        padding-left: 0.25rem;
    }

    .top {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        padding-right: 1rem;
        padding-left: 1rem;
        margin-top: 0.25rem;
        margin-bottom: 0.25rem;
    }

    .registers {
        display: flex;
        flex-direction: row;
        gap: 0.33rem;
        justify-content: space-evenly;
    }

    .registers .register {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        min-width: 120px;
        height: 50px;
        border: 1px solid black;
        background-color: white;
        border-radius: 8px;
        padding: 0;
        transition: 250ms cubic-bezier(0.075, 0.82, 0.165, 1);
    }

    .registers .register:hover {
        background-color: #f0f0f0;
    }
    .registers .register:active {
        background-color: #000000;
        color: #ffffff;
        transition: 150ms cubic-bezier(0.075, 0.82, 0.165, 1);
    }

    .registers .register .register-name {
        font-weight: bolder;
        border-bottom: 1px solid black;
        width: 100%;
        text-align: center;
    }

    .registers .register .register-value {
        display: flex;
        height: 100%;
        justify-content: center;
        align-items: center;
        text-align: center;
        vertical-align: center;
        font-family: 'Courier New', Courier, monospace;
        font-weight: bolder;
        font-size: 16px;
    }

    .controls {
        display: flex;
        flex-direction: row;
        justify-content: space-evenly;
        align-items: center;
        gap: 0.33rem;
    }

    .controls .control {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-width: 50px;
        height: 50px;
        max-width: 125px;
        border-radius: 8px;
        border: 1px solid black;
        background: none;
        position: relative;

        transition: 250ms cubic-bezier(0.075, 0.82, 0.165, 1)
    }

    .controls .control .label {
        font-size: 12px;
        font-weight: bold;
        margin-top: 4px;
    }

    .controls .control .icon {
        margin-right: 0;
        font-size: 18px;
    }

    .controls .control .hotkey {
        position: absolute;
        top: 1px;
        right: 4px;
        font-size: 9px; /* Make it smaller */
        font-weight: bold;
    }

    .controls .control:hover {
        background: #f0f0f0;
    }
    .controls .control:active {
        background: #000000;
        color: #ffffff;
        transition: 150ms cubic-bezier(0.075, 0.82, 0.165, 1);
    }

    .vs {
        width: 1px; /* Thickness of the separator */
        background-color: black; /* Color of the separator */
        height: 50px; /* Match the height of registers and controls */
        align-self: center; /* Ensures it aligns properly in flex container */
        margin: 0 2px; /* Adjust spacing between registers and controls */
    }
</style>
<script defer>
    let MONACO_IS_READY = false;
    let EDITOR = null;
    let MONACO = null;

    let REGISTER_STATE = {
        value_ACC: 0,
        value_BAK: 0,
        value_PC: 0,
        mode_ACC: "dec",
        mode_BAK: "dec",
        mode_PC: "dec",
        hover_ACC: "none",
        hover_BAK: "none",
        hover_PC: "none",
    }

    let STACK = new Array(0).fill(0);

    /* PREPARE DISPLAY */ (() => {
        const container = document.getElementById('display');
        let row = "";

        for(let i=0; i<256; i++) {
            let cells = "<div class='row'>";
            for(let j=0; j<256; j++) {
                const coord = i * 256 + j;
                cells += `<div class='cell' id='${coord}'></div>`;
            }
            cells += "</div>";

            row += cells;
        }

        container.innerHTML = row;
    })();

    require.config({ paths: { 'vs': 'https://unpkg.com/monaco-editor@latest/min/vs' } });
    window.MonacoEnvironment = { getWorkerUrl: () => proxy };
    let proxy = URL.createObjectURL(new Blob(
        [`
            self.MonacoEnvironment = {
                baseUrl: 'https://unpkg.com/monaco-editor@latest/min/'
            };
            importScripts('https://unpkg.com/monaco-editor@latest/min/vs/base/worker/workerMain.js');
        `],
        { type: 'text/javascript' }
    ));

    require(["vs/editor/editor.main"], function () {
        monaco.languages.register({ id: 'tislang' });

        // Register a tokens provider for the language
        monaco.languages.setMonarchTokensProvider('tislang', {
            symbols: /[=<>!~?:&|+\-*\/^%]+/,

            tokenizer: {
                root: [
                    // Labels (must end with a colon, with optional leading spaces)
                    [/^\s*([A-Za-z_][\w]*)(:)/, ['type.identifier', 'delimiter']],

                    // Keywords (instructions)
                    [/\b(?:NOP|MOV|PUSH|POP|SWP|SAV|ADD|SUB|NEG|JMP|JEZ|JNZ|JGZ|JLZ|JRO|nop|mov|push|pop|swp|sav|add|sub|neg|jmp|jez|jnz|jgz|jlz|jro)\b/, 'keyword'],

                    // Label references (after JMP, JEZ, JGZ, etc.)
                    [/\b(?:JMP|JEZ|JNZ|JGZ|JLZ|JRO|jmp|jez|jnz|jgz|jlz|jro)\s+([A-Za-z_][\w]*)\b/, ['keyword', 'type.identifier']],

                    // Registers (Only ACC, BAK is not accessible directly)
                    [/\b(ACC)\b/, 'variable'],
                    [/\b(BAK)\b/, 'invalid'],

                    // Memory addresses ($ followed by digits or hex values)
                    [/\$0x[0-9a-fA-F]+\b/, 'storage.hex'], // Hex memory address ($0xABCD)
                    [/\$\d+\b/, 'storage.number'],         // Decimal memory address ($1234)

                    // Literals (numeric constants)
                    [/\b\d+\b/, 'number'],                 // 1234 (Decimal)
                    [/0x[0-9a-fA-F]+\b/, 'number.hex'],    // 0xABCD (Hex)

                    // Comments
                    [/#.*/, 'comment'],

                    // Whitespace
                    [/[ \t\r\n]+/, 'white'],
                ]
            }
        });


        monaco.editor.defineTheme("tis-theme", {
            base: "vs-dark",
            inherit: true,
            rules: [
                { token: "keyword", foreground: "ffff00", background: "ff0000", fontStyle: "bold" },
                { token: "variable", foreground: "A0F0FF" },
                { token: "storage.number", foreground: "FFAA00"},
                { token: "storage.hex", foreground: "FFAA00"},
                { token: "number", foreground: "FF8A00"},
                { token: "number.hex", foreground: "FF8A00"},
                { token: "comment", foreground: "20a872"},
                { token: "type.identifier", foreground: "FF00FF"},
                { token: "invalid", foreground: "FF0000", fontStyle: "italic underline" },
            ],
            colors: {
                "editor.foreground": "#A250A2",
            },
        });

        // Register a completion item provider for the new language
        monaco.languages.registerCompletionItemProvider("tislang", {
            provideCompletionItems: (model, position) => {
                var word = model.getWordUntilPosition(position);
                var range = {
                    startLineNumber: position.lineNumber,
                    endLineNumber: position.lineNumber,
                    startColumn: word.startColumn,
                    endColumn: word.endColumn,
                };
                var suggestions = [
                    {
                        label: "MOV",
                        kind: monaco.languages.CompletionItemKind.Keyword,
                        insertText: "MOV ${1:source} ${2:destination}",
                        insertTextRules:
                            monaco.languages.CompletionItemInsertTextRule
                                .InsertAsSnippet,
                        range: range,
                    },
                    {
                        label: 'NOP',
                        kind: monaco.languages.CompletionItemKind.Keyword,
                        insertText: "NOP",
                        range: range
                    },
                    {
                        label: 'SWP',
                        kind: monaco.languages.CompletionItemKind.Keyword,
                        insertText: "SWP",
                        range: range
                    },
                    {
                        label: 'SAV',
                        kind: monaco.languages.CompletionItemKind.Keyword,
                        insertText: "SAV",
                        range: range
                    },
                    {
                        label: 'ADD',
                        kind: monaco.languages.CompletionItemKind.Keyword,
                        insertText: "ADD ${1:source}",
                        insertTextRules:
                            monaco.languages.CompletionItemInsertTextRule
                                .InsertAsSnippet,
                        range: range
                    },
                    {
                        label: 'SUB',
                        kind: monaco.languages.CompletionItemKind.Keyword,
                        insertText: "SUB ${1:source}",
                        insertTextRules:
                            monaco.languages.CompletionItemInsertTextRule
                                .InsertAsSnippet,
                        range: range
                    },
                    {
                        label: 'NEG',
                        kind: monaco.languages.CompletionItemKind.Keyword,
                        insertText: "NEG ${1:source}",
                        insertTextRules:
                            monaco.languages.CompletionItemInsertTextRule
                                .InsertAsSnippet,
                        range: range
                    },
                    {
                        label: 'JMP',
                        kind: monaco.languages.CompletionItemKind.Keyword,
                        insertText: "JMP ${1:label}",
                        insertTextRules:
                            monaco.languages.CompletionItemInsertTextRule
                                .InsertAsSnippet,
                        range: range
                    },
                    {
                        label: 'JEZ',
                        kind: monaco.languages.CompletionItemKind.Keyword,
                        insertText: "JEZ ${1:label}",
                        insertTextRules:
                            monaco.languages.CompletionItemInsertTextRule
                                .InsertAsSnippet,
                        range: range
                    },
                    {
                        label: 'JNZ',
                        kind: monaco.languages.CompletionItemKind.Keyword,
                        insertText: "JNZ ${1:label}",
                        insertTextRules:
                            monaco.languages.CompletionItemInsertTextRule
                                .InsertAsSnippet,
                        range: range
                    },
                    {
                        label: 'JGZ',
                        kind: monaco.languages.CompletionItemKind.Keyword,
                        insertText: "JGZ ${1:label}",
                        insertTextRules:
                            monaco.languages.CompletionItemInsertTextRule
                                .InsertAsSnippet,
                        range: range
                    },
                    {
                        label: 'JLZ',
                        kind: monaco.languages.CompletionItemKind.Keyword,
                        insertText: "JLZ ${1:label}",
                        insertTextRules:
                            monaco.languages.CompletionItemInsertTextRule
                                .InsertAsSnippet,
                        range: range
                    },
                    {
                        label: 'JRO',
                        kind: monaco.languages.CompletionItemKind.Keyword,
                        insertText: "JRO ${1:offset}",
                        insertTextRules:
                            monaco.languages.CompletionItemInsertTextRule
                                .InsertAsSnippet,
                        range: range
                    },
                ];
                return { suggestions: suggestions };
            },
        });

let editor = monaco.editor.create(document.getElementById('editor'), {
    value: [
        '   MOV     1234        ACC         # Move 1234 to ACC register',
        '   MOV     0xff1234    ACC         # Move 0xff1234 to ACC register',
        '   MOV     $1234       ACC         # Move value at memory address 1234 to ACC register',
        '   MOV     $0xff1234   ACC         # Move value at memory address 0xff1234 to ACC register',
        '   MOV     ACC         $1234       # Move value in ACC register to memory address 1234',
        '   MOV     ACC         $0xff1234   # Move value in ACC register to memory address 0xff1234',
        '   SWP                             # Swap the values in ACC and BAK registers',
        '   ADD     ACC',
        '   MOV     ACC         $0x3',
        '   MOV     BAK         ACC',
        '   NOP',
        '',
        'EXAMPLE_LABEL:                     # Label definition',
        '   MOV     0x3         ACC',
        '   ADD     ACC',
        '   JEZ EXAMPLE_LABEL',
        '',
        'FINISH:                            # Another label definition',
        '   MOV     0x3         ACC',
        '   ADD     ACC',
        '   JGZ EXAMPLE_LABEL',
    ].join('\n'),
    language: 'tislang',
    theme: 'tis-theme',
    automaticLayout: true,
    lineNumbers: (originalNumber) => originalNumber - 1
});

        EDITOR = editor;
        MONACO = monaco;
        MONACO_IS_READY = true;
    });
</script>
</html>
